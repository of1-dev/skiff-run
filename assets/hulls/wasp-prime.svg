<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- endgame war hull -->
  <defs>
    <linearGradient id="metal-wasp-prime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF6"/>
      <stop offset="45%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="shade-wasp-prime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3340" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2A3340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-wasp-prime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB24A" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="canopy-wasp-prime" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#3AA0C8"/>
      <stop offset="100%" stop-color="#0B3A4A"/>
    </radialGradient>
  </defs>
  <ellipse cx="90" cy="66" rx="56" ry="4" fill="#000" opacity=".32"/>
  <g id="hull">
    <path fill="url(#metal-wasp-prime)" d="M10 34 L10 50 L30 60 L98 54 L158 40 L98 26 L30 20 Z"/>
    <path fill="url(#shade-wasp-prime)" d="M10 34 L10 50 L30 60 L98 54 L158 40 L98 26 L30 20 Z"/>
    <path fill="#7A8798" d="M38 20 L68 6 L74 24 Z"/>
    <path fill="#7A8798" d="M38 60 L68 74 L74 56 Z"/>
    <path fill="#8A96A8" d="M68 16 L100 4 L104 22 L76 28 Z"/>
    <path fill="#8A96A8" d="M68 64 L100 76 L104 58 L76 52 Z"/>
    <path stroke="#EEF3FA" stroke-width=".9" opacity=".5" d="M36 32 L130 36 M36 48 L130 44"/>
  </g>
  <g id="canopy">
    <rect x="104" y="30" width="24" height="18" rx="2.5" fill="url(#canopy-wasp-prime)"/>
    <circle cx="114" cy="39" r="4" fill="#E8FBFF" opacity=".55"/>
    <rect x="108" y="33" width="6" height="4" rx=".4" fill="#B8F0FF" opacity=".45"/>
  </g>
  <g id="thruster">
    <rect x="0" y="34" width="14" height="16" rx="2" fill="#2A3340"/>
    <ellipse cx="-1" cy="42" rx="8" ry="6" fill="url(#glow-wasp-prime)"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="#fff"/></g>
</svg>
