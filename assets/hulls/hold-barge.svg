<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- fat cargo hauler -->
  <g id="hull">
    <rect x="36" y="30" width="92" height="30" rx="3" fill="currentColor"/>
    <rect x="44" y="16" width="34" height="16" rx="2" fill="currentColor" opacity=".72"/>
    <rect x="84" y="16" width="34" height="16" rx="2" fill="currentColor" opacity=".72"/>
    <rect x="18" y="32" width="18" height="26" rx="2" fill="currentColor" opacity=".9"/>
  </g>
  <g id="canopy">
    <rect x="50" y="20" width="22" height="8" rx="1" fill="currentColor" opacity=".35"/>
  </g>
  <g id="thruster">
    <rect x="6" y="34" width="12" height="10" rx="1.5" fill="currentColor"/>
    <rect x="6" y="46" width="12" height="10" rx="1.5" fill="currentColor" opacity=".85"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="currentColor"/></g>
</svg>
