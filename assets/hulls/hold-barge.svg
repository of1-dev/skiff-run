<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- fat cargo hauler -->
  <defs>
    <linearGradient id="metal-hold-barge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF6"/>
      <stop offset="45%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="shade-hold-barge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3340" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2A3340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-hold-barge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB24A" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="canopy-hold-barge" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#3AA0C8"/>
      <stop offset="100%" stop-color="#0B3A4A"/>
    </radialGradient>
  </defs>
  <ellipse cx="86" cy="66" rx="54" ry="3.8" fill="#000" opacity=".3"/>
  <g id="hull">
    <rect x="34" y="30" width="96" height="30" rx="3" fill="url(#metal-hold-barge)"/>
    <rect x="34" y="30" width="96" height="30" rx="3" fill="url(#shade-hold-barge)"/>
    <rect x="42" y="14" width="36" height="18" rx="2" fill="url(#metal-hold-barge)"/>
    <rect x="84" y="14" width="36" height="18" rx="2" fill="url(#metal-hold-barge)"/>
    <rect x="16" y="32" width="20" height="26" rx="2" fill="#5A687A"/>
    <path stroke="#EEF3FA" stroke-width=".85" opacity=".55" d="M50 30 L50 60 M70 30 L70 60 M90 30 L90 60 M110 30 L110 60 M42 22 L74 22 M84 22 L116 22"/>
  </g>
  <g id="canopy">
    <rect x="48" y="18" width="24" height="8" rx="1" fill="url(#canopy-hold-barge)"/>
  </g>
  <g id="thruster">
    <rect x="4" y="34" width="12" height="10" rx="1.5" fill="#2A3340"/>
    <rect x="4" y="46" width="12" height="10" rx="1.5" fill="#2A3340" opacity=".9"/>
    <ellipse cx="3" cy="39" rx="5" ry="3.5" fill="url(#glow-hold-barge)"/>
    <ellipse cx="3" cy="51" rx="5" ry="3.5" fill="url(#glow-hold-barge)"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="#fff"/></g>
</svg>
