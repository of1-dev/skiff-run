<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- multi-role freighter -->
  <defs>
    <linearGradient id="metal-tide-runner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF6"/>
      <stop offset="45%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="shade-tide-runner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3340" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2A3340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-tide-runner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB24A" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="canopy-tide-runner" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#3AA0C8"/>
      <stop offset="100%" stop-color="#0B3A4A"/>
    </radialGradient>
  </defs>
  <ellipse cx="84" cy="64" rx="52" ry="4" fill="#000" opacity=".28"/>
  <g id="hull">
    <path fill="url(#metal-tide-runner)" d="M16 42 C26 26, 52 18, 80 20 C112 22, 138 28, 150 40 C138 52, 112 58, 80 60 C52 62, 26 54, 16 38 Z"/>
    <path fill="url(#shade-tide-runner)" d="M16 42 C26 26, 52 18, 80 20 C112 22, 138 28, 150 40 C138 52, 112 58, 80 60 C52 62, 26 54, 16 38 Z"/>
    <ellipse cx="72" cy="40" rx="24" ry="13" fill="#5A687A" opacity=".35"/>
    <path stroke="#EEF3FA" stroke-width=".8" opacity=".5" d="M40 28 L110 32 M40 52 L110 48 M70 24 L70 56"/>
    <rect x="48" y="22" width="22" height="8" rx="1.5" fill="#6B7788" opacity=".7"/>
  </g>
  <g id="canopy">
    <ellipse cx="122" cy="40" rx="8" ry="4.5" fill="url(#canopy-tide-runner)"/>
    <ellipse cx="119" cy="39" rx="2.5" ry="1.4" fill="#E8FBFF" opacity=".6"/>
  </g>
  <g id="thruster">
    <rect x="4" y="34" width="14" height="14" rx="3" fill="#2A3340"/>
    <ellipse cx="3" cy="41" rx="7" ry="5" fill="url(#glow-tide-runner)"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="#fff"/></g>
</svg>
