    <rect x="42" y="16" width="48" height="16" rx="2" fill="currentColor" opacity=".7"/>
    <circle cx="40" cy="58" r="5" fill="currentColor" opacity=".5"/>
    <circle cx="110" cy="58" r="5" fill="currentColor" opacity=".5"/>
