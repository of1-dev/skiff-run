<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- mid cargo box -->
  <defs>
    <linearGradient id="metal-knot-hauler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF6"/>
      <stop offset="45%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="shade-knot-hauler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3340" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2A3340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-knot-hauler" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB24A" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="canopy-knot-hauler" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#3AA0C8"/>
      <stop offset="100%" stop-color="#0B3A4A"/>
    </radialGradient>
  </defs>
  <ellipse cx="86" cy="66" rx="50" ry="3.5" fill="#000" opacity=".28"/>
  <g id="hull">
    <rect x="24" y="30" width="104" height="28" rx="3" fill="url(#metal-knot-hauler)"/>
    <rect x="24" y="30" width="104" height="28" rx="3" fill="url(#shade-knot-hauler)"/>
    <rect x="40" y="14" width="52" height="18" rx="2" fill="url(#metal-knot-hauler)"/>
    <rect x="40" y="14" width="52" height="18" rx="2" fill="#5A687A" opacity=".25"/>
    <path stroke="#EEF3FA" stroke-width=".8" opacity=".55" d="M40 38 L120 38 M56 30 L56 58 M88 30 L88 58 M40 20 L88 20"/>
    <circle cx="38" cy="60" r="5" fill="#4A5568"/>
    <circle cx="112" cy="60" r="5" fill="#4A5568"/>
    <circle cx="38" cy="60" r="2" fill="#2A3340"/>
    <circle cx="112" cy="60" r="2" fill="#2A3340"/>
  </g>
  <g id="canopy">
    <rect x="48" y="18" width="22" height="9" rx="1.5" fill="url(#canopy-knot-hauler)"/>
    <rect x="50" y="19.5" width="6" height="3" rx="0.4" fill="#E8FBFF" opacity=".5"/>
  </g>
  <g id="thruster">
    <rect x="8" y="34" width="16" height="18" rx="2" fill="#2A3340"/>
    <path fill="#5A687A" opacity=".7" d="M126 32 L150 30 L150 54 L126 56 Z"/>
    <ellipse cx="7" cy="43" rx="6" ry="5" fill="url(#glow-knot-hauler)"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="#fff"/></g>
</svg>
