<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- gated compact war — small unassuming wedge, tiny bay, overgunned look without capital mass -->
  <g id="hull">
    <path fill="currentColor" d="M48 34 L48 46 L70 52 L118 46 L136 40 L118 34 L70 28 Z"/>
    <path fill="currentColor" opacity=".45" d="M78 36 L102 40 L78 44 Z"/>
    <!-- tiny bay notch -->
    <rect x="84" y="42" width="16" height="6" rx="1" fill="currentColor" opacity=".35"/>
  </g>
  <g id="canopy">
    <rect x="104" y="36" width="12" height="8" rx="1" fill="currentColor" opacity=".65"/>
  </g>
  <g id="thruster">
    <rect x="36" y="36" width="14" height="10" rx="1.5" fill="currentColor" opacity=".9"/>
    <!-- cheek nacelle hints flush -->
    <rect x="60" y="30" width="22" height="6" rx="1" fill="currentColor" opacity=".5"/>
    <rect x="60" y="44" width="22" height="6" rx="1" fill="currentColor" opacity=".5"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="currentColor"/></g>
</svg>
