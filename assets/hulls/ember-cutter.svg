<svg class="hull-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" fill="none" aria-hidden="true">
  <!-- armed cutter -->
  <defs>
    <linearGradient id="metal-ember-cutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8EEF6"/>
      <stop offset="45%" stop-color="#9AA8BC"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <linearGradient id="shade-ember-cutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2A3340" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2A3340" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-ember-cutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB24A" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#FF6A2A" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="canopy-ember-cutter" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#B8F0FF"/>
      <stop offset="55%" stop-color="#3AA0C8"/>
      <stop offset="100%" stop-color="#0B3A4A"/>
    </radialGradient>
  </defs>
  <ellipse cx="88" cy="64" rx="50" ry="3.5" fill="#000" opacity=".28"/>
  <g id="hull">
    <path fill="url(#metal-ember-cutter)" d="M16 38 L16 46 L40 54 L112 48 L154 40 L112 32 L40 26 Z"/>
    <path fill="url(#shade-ember-cutter)" d="M16 38 L16 46 L40 54 L112 48 L154 40 L112 32 L40 26 Z"/>
    <path fill="#7A8798" d="M70 16 L94 12 L96 20 L74 24 Z"/>
    <path fill="#7A8798" d="M70 64 L94 68 L96 60 L74 56 Z"/>
    <path stroke="#EEF3FA" stroke-width=".8" opacity=".55" d="M48 34 L120 38 M48 46 L120 42"/>
  </g>
  <g id="canopy">
    <rect x="100" y="33" width="18" height="13" rx="2" fill="url(#canopy-ember-cutter)"/>
    <rect x="102" y="35" width="5" height="4" rx=".4" fill="#E8FBFF" opacity=".55"/>
  </g>
  <g id="thruster">
    <rect x="4" y="35" width="14" height="14" rx="2" fill="#2A3340"/>
    <ellipse cx="3" cy="42" rx="7" ry="5" fill="url(#glow-ember-cutter)"/>
  </g>
  <g id="hit-flash" opacity="0"><rect width="160" height="80" fill="#fff"/></g>
