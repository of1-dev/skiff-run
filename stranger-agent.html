<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stranger's Agent Smoke Test</title>
  <style>
    body { display: flex; font-family: system-ui, sans-serif; height: 100vh; margin: 0; background: #0a0a0c; color: #e8eefa; }
    #agent-panel { width: 380px; padding: 24px; background: #161a22; border-right: 1px solid #2a3340; overflow-y: auto; display: flex; flex-direction: column; }
    #game-frame { flex: 1; border: none; }
    .log { margin-bottom: 12px; font-size: 14px; line-height: 1.4; padding: 8px; border-radius: 4px; background: #222a36; }
    .log.agent { border-left: 4px solid #ffb24a; }
    .log.system { border-left: 4px solid #4a5568; color: #9aa8bc; }
    .log.action { border-left: 4px solid #7ec8e8; font-family: monospace; }
    button { background: #ffb24a; border: none; padding: 12px; border-radius: 6px; cursor: pointer; color: #111; font-weight: bold; width: 100%; margin-bottom: 24px; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    button:disabled { background: #4a5568; cursor: not-allowed; }
    h2 { margin-top: 0; font-size: 18px; color: #ffb24a; }
    p { font-size: 14px; color: #9aa8bc; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div id="agent-panel">
    <h2>Third-Party Agent UI</h2>
    <p>This simulates what an AI extension or browser-native agent sees when you drop a WebMCP URL into it.</p>
    <button id="btn-start">Simulate Agent Turn</button>
    <div id="logs"></div>
  </div>
  
  <!-- We load the game in bridge mode -->
  <iframe id="game-frame" src="/?bridge=1"></iframe>

  <script>
    const logs = document.getElementById('logs');
    const btn = document.getElementById('btn-start');

    function log(msg, type='system') {
      const d = document.createElement('div');
      d.className = 'log ' + type;
      d.innerText = msg;
      logs.prepend(d);
    }

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    btn.onclick = async () => {
      btn.disabled = true;
      const frame = document.getElementById('game-frame').contentWindow;
      
      if (!frame || !frame.navigator.modelContext) {
        log("Error: WebMCP not detected in iframe yet. Wait for game to load.", "system");
        btn.disabled = false;
        return;
      }
      
      const mc = frame.navigator.modelContext;
      log("Agent connected to navigator.modelContext!", "system");
      await sleep(1000);
      
      // 1. Discover Tools
      const tools = mc.listTools();
      log(`Discovered ${tools.length} available tools.`, "system");
      await sleep(1000);

      async function refreshState() {
        const r = await mc.callTool("skiff_state");
        const obj = JSON.parse(r.content[0].text);
        return obj.state || obj;
      }

      let state = await refreshState();
      log(`Docked at ${state.systemName || state.system} | Credits: ₩${(state.credits || 0).toLocaleString()} | Hold: ${state.cargoUsed}/${state.cargoMax} | Fuel: ${state.fuel}/${state.fuelMax}`, "agent");
      await sleep(1500);

      // Step A: Liquidate incoming cargo on the local market
      if (state.cargoUsed > 0) {
        log(`Thinking: We arrived with ${state.cargoUsed} units of cargo. Liquidating on local exchange...`, "agent");
        log("-> callTool('skiff_sell_expensive')", "action");
        const sellRes = await mc.callTool("skiff_sell_expensive");
        const sellParsed = JSON.parse(sellRes.content[0].text);
        log(sellParsed.log || (sellParsed.ok ? "Cargo sold." : "Market holds no premium right now."), "system");
        state = await refreshState();
        await sleep(1500);
      }

      // Step B: Buy Dock Press & inspect news/leads/quests
      if (state.pressBoughtAt !== state.system && state.credits >= 75) {
        log("Thinking: Purchasing today's Dock Press to check market rumors and quest bounties.", "agent");
        log("-> callTool('skiff_buy_press')", "action");
        const pressRes = await mc.callTool("skiff_buy_press");
        const pressParsed = JSON.parse(pressRes.content[0].text);
        log(pressParsed.log || "Dock Press acquired.", "system");
        state = await refreshState();
        if (state.quests && state.quests.length > 0) {
          const latestQ = state.quests[state.quests.length - 1];
          log(`Intel: Found active lead — "${latestQ.title}" (Reward: ₩${latestQ.reward})`, "agent");
        }
        await sleep(1500);
      }

      // Step C: Maintenance (Repairs & Refueling)
      if (state.hull < state.hullMax && state.credits > 100) {
        log(`Thinking: Hull at ${state.hull}/${state.hullMax}. Purchasing shipyard repairs.`, "agent");
        log("-> callTool('skiff_repair')", "action");
        const repRes = await mc.callTool("skiff_repair");
        const repParsed = JSON.parse(repRes.content[0].text);
        log(repParsed.log || "Ship repaired.", "system");
        state = await refreshState();
        await sleep(1200);
      }
      if (state.fuel < state.fuelMax && state.credits > 50) {
        log(`Thinking: Refueling tanks (${state.fuel}/${state.fuelMax}).`, "agent");
        log("-> callTool('skiff_refuel')", "action");
        const refRes = await mc.callTool("skiff_refuel");
        const refParsed = JSON.parse(refRes.content[0].text);
        log(refParsed.log || "Tanks topped off.", "system");
        state = await refreshState();
        await sleep(1200);
      }

      // Step D: Buy cheap goods if hold space is available
      if (state.cargoUsed < state.cargoMax && state.credits > 150) {
        log("Thinking: Hold has room. Buying below-average commodities to haul.", "agent");
        log("-> callTool('skiff_fill_cheap')", "action");
        const fillRes = await mc.callTool("skiff_fill_cheap");
        const fillParsed = JSON.parse(fillRes.content[0].text);
        log(fillParsed.log || "Loaded commodities.", "system");
        state = await refreshState();
        await sleep(1500);
      }

      // Step E: Consult Star Chart & Jump
      log("Thinking: Plotting jump course...", "agent");
      log("-> callTool('skiff_chart', { mode: 'local' })", "action");
      const chartRes = await mc.callTool("skiff_chart", { mode: "local" });
      const chart = JSON.parse(chartRes.content[0].text);
      await sleep(1500);

      if (chart && chart.length > 0) {
        // Check if any destination matches an active quest
        let target = null;
        if (state.quests && state.quests.length > 0) {
          target = chart.find(c => state.quests.some(q => q.dest === c.id));
          if (target) {
            log(`Strategy: System ${target.name} has an active bounty/quest! Locking coordinates.`, "agent");
          }
        }
        if (!target) {
          target = chart[Math.floor(Math.random() * chart.length)];
          log(`Strategy: Jumping to ${target.name} to trade and explore.`, "agent");
        }

        log(`-> callTool('skiff_jump', { system: '${target.id}' })`, "action");
        const jumpRes = await mc.callTool("skiff_jump", { system: target.id });
        const jumpParsed = JSON.parse(jumpRes.content[0].text);
        log(jumpParsed.log || `Arrived at ${target.name}.`, "system");
      } else {
        log("Thinking: No systems in jump range or insufficient fuel.", "agent");
      }

      log("Agent turn complete.", "system");
      setTimeout(() => btn.disabled = false, 500);
    };
  </script>
</body>
</html>
